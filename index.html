<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грошопал</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Грошопал — скільки горить ваша зустріч</h1>

        <div class="field">
            <label for="participants">Кількість учасників</label>
            <input type="number" id="participants" min="1" value="3">
        </div>

        <div class="field">
            <label for="rate">Середня годинна ставка (грн/год)</label>
            <input type="number" id="rate" min="0" value="500">
        </div>

        <button id="toggle" class="btn btn-start">Старт</button>

        <div class="display">
            <div class="burned" id="burned">0.00 грн</div>
            <div class="elapsed" id="elapsed">00:00:00</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
